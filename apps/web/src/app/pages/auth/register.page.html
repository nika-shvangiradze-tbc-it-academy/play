<section class="auth-wrap">
  <form class="panel auth-card" (ngSubmit)="submit()">
    <h1>ანგარიშის შექმნა</h1>
    <p class="lead">აირჩიე უნიკალური სახელი მაგიდებისთვის.</p>

    <div class="field">
      <label for="username">მომხმარებლის სახელი</label>
      <input
        id="username"
        name="username"
        [(ngModel)]="username"
        required
        minlength="3"
        maxlength="20"
        autocomplete="username"
      />
    </div>
    <div class="field">
      <label for="email">ელფოსტა</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">პაროლი</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="6"
        autocomplete="new-password"
      />
    </div>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'იქმნება…' : 'რეგისტრაცია' }}
    </button>

    <p class="footer-links">
      <a routerLink="/login">უკვე გაქვს ანგარიში?</a>
    </p>
  </form>
</section>
