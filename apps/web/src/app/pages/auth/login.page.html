<section class="auth-wrap">
  <form class="panel auth-card" (ngSubmit)="submit()">
    <h1>კეთილი იყოს თქვენი დაბრუნება</h1>
    <p class="lead">შედი, რომ შექმნა ან შეუერთდე პირად მაგიდას.</p>

    <div class="field">
      <label for="email">ელფოსტა</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">პაროლი</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
      />
    </div>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'შესვლა…' : 'შესვლა' }}
    </button>

    <p class="footer-links">
      <a routerLink="/forgot-password">დაგავიწყდათ პაროლი?</a>
      <a routerLink="/register">ანგარიშის შექმნა</a>
    </p>
  </form>
</section>
