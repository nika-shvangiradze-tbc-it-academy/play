<section class="auth-wrap">
  <form class="panel auth-card" (ngSubmit)="submit()">
    <h1>პაროლის აღდგენა</h1>
    <p class="lead">გამოგიგზავნით უსაფრთხო ბმულს ელფოსტაზე.</p>

    <div class="field">
      <label for="email">ელფოსტა</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
    </div>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    @if (success()) {
      <p class="success-text">შეამოწმე შემოსული წერილები აღდგენის ბმულისთვის.</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'იგზავნება…' : 'ბმულის გაგზავნა' }}
    </button>

    <p class="footer-links">
      <a routerLink="/login">შესვლაზე დაბრუნება</a>
    </p>
  </form>
</section>
