<section class="auth-wrap">
  <form class="panel auth-card" (ngSubmit)="submit()">
    <h1>Reset password</h1>
    <p class="lead">We’ll email you a secure reset link.</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
    </div>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    @if (success()) {
      <p class="success-text">Check your inbox for the reset link.</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'Sending…' : 'Send reset link' }}
    </button>

    <p class="footer-links">
      <a routerLink="/login">Back to login</a>
    </p>
  </form>
</section>
